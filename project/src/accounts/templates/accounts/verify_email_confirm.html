{% extends "base.html" %}
{% block title %}Emailni tasdiqlash{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-md px-4 py-10">
  <h1 class="mb-6 text-2xl font-semibold text-slate-900 dark:text-slate-100">Emailni tasdiqlash</h1>
  {% include "accounts/_messages.html" %}
  <p class="mb-5 text-sm text-slate-600 dark:text-slate-300">Emailingizni tasdiqlash uchun tugmani bosing.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="inline-flex w-full justify-center rounded-lg bg-indigo-700 px-4 py-2 font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Emailni tasdiqlash</button>
  </form>
</div>
{% endblock %}
