{% if field.is_hidden %}{{ field }}{% else %}
<div>
  {% if field.widget_type == "checkbox" %}
  <div class="flex items-start gap-3">
    {{ field }}
    <label for="{{ field.id_for_label }}" class="text-sm text-slate-800 dark:text-slate-200">{{ field.label }}</label>
  </div>
  {% else %}
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-800 dark:text-slate-200">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  <div id="{{ field.auto_id }}_desc" class="mt-1 space-y-1 text-sm">
    {% if field.help_text %}<div class="text-slate-600 dark:text-slate-400">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<p role="alert" class="text-red-700 dark:text-red-400">{{ error }}</p>{% endfor %}
  </div>
</div>
{% endif %}
